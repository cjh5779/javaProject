<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h2>회원 가입</h2>
	<hr>

	<form action="join" method="post">
		<table>
			<tr>
				<th>성명</th>
                <td><input type="text" name="name"></td>
			</tr>
			<tr>
                <th>ID</th>
                <td><input type="text" name="id"></td>
            </tr>
            <tr>
                <th>비밀번호</th>
                <td><input type="password" name="pwd"></td>
            </tr>
            <tr>
                <th>휴대폰 번호</th>
                <td>
                    <input type="text" name="phone1" size="3"> -
                    <input type="text" name="phone2" size="4"> -
                    <input type="text" name="phone3" size="4">
                </td>
            </tr>
            <tr>
                <th>학년</th>
                <td>
                    <input type="radio" name="grade" value="1학년"> 1학년
                    <input type="radio" name="grade" value="2학년"> 2학년
                    <input type="radio" name="grade" value="3학년"> 3학년
                    <input type="radio" name="grade" value="4학년"> 4학년
                </td>
            </tr>
            <tr>
                <th>관심분야</th>
                <td>
                    <input type="checkbox" name="interest" value="웹 프로그래밍"> 웹 프로그래밍
                    <input type="checkbox" name="interest" value="파이썬"> 파이썬
                    <input type="checkbox" name="interest" value="빅데이터"> 빅데이터
                    <input type="checkbox" name="interest" value="자바 프로그래밍"> 자바 프로그래밍
                </td>
            </tr>
            <tr>
                <th>학과</th>
                <td>
                    <select name="major">
                        <option value="">선택하세요</option>
                        <option value="콘텐츠IT전공">콘텐츠IT전공</option>
                        <option value="컴퓨터공학과">컴퓨터공학과</option>
                        <option value="인공지능학과">인공지능학과</option>
                    </select>
                </td>
            </tr>
		</table>
		<input type="submit" value="전송">   
		<input type="reset" value="초기화">

	</form>
</body>
</html>
